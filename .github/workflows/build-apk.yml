name: Build APK

on:
  push:
    branches: [main, claude/expense-wallet-app-03wa3b]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masareef-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk masareef.apk
          gh release create apk masareef.apk \
            --title "تطبيق مصاريفي — آخر نسخة" \
            --notes "نزّل ملف masareef.apk وثبّته على جوالك." \
            || gh release upload apk masareef.apk --clobber
